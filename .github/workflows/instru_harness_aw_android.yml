name: Instru Harness (aw-android)

on:
  workflow_dispatch:

jobs:
  emu_community:
    name: Emu_Community connectedAndroidTest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: List connectedAndroidTest tasks
        run: ./gradlew :mobile:tasks --all | sed -n '/connected.*AndroidTest/Ip'

      - name: Run instrumentation (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew --no-daemon :mobile:connectedDebugAndroidTest

      - name: Upload test reports (best-effort)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            mobile/build/reports/**
            mobile/build/outputs/androidTest-results/**
            mobile/build/test-results/**
          if-no-files-found: ignore
